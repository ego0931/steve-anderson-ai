name: Enable Pages
on:
  push:
    paths: ['.github/workflows/enable-pages.yml']
  workflow_dispatch:
permissions:
  pages: write
  contents: read
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST repos/${{ github.repository }}/pages -f 'source[branch]=gh-pages' -f 'source[path]=/' || gh api repos/${{ github.repository }}/pages
